# Render Blueprint: deploys the AgriEdge server (control panel + phone API).
# Render dashboard → New → Blueprint → pick this repo. See README "Put the
# server online".
services:
  - type: web
    name: agriedge
    runtime: node
    plan: free
    rootDir: backend
    # npm 11 skips install scripts, so build better-sqlite3's native module explicitly.
    buildCommand: npm ci && npm rebuild better-sqlite3
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Password for the control panel (any username). Render asks for it on first deploy.
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: free data.gov.in key for all-India mandi prices (can also be set in the panel).
      - key: DATA_GOV_IN_API_KEY
        sync: false
