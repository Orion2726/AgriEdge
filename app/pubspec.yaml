name: agriedge
description: "AgriEdge — offline-first farmers' app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

# sqlite3_flutter_libs already bundles a native sqlite3 build into the app
# (via CocoaPods/Gradle) and links it into the running process. Without this,
# the sqlite3 package's own build hook tries to *additionally* download a
# separate precompiled binary from GitHub release assets at build time —
# unnecessary here, and fails hard on networks that block that CDN host.
hooks:
  user_defines:
    sqlite3:
      source: process

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Local database (offline-first structured storage)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Background sync
  workmanager: ^0.5.2

  # On-device ML (disease detection)
  tflite_flutter: ^0.11.0
  image_picker: ^1.1.2
  image: ^4.3.0

  # Location (soil report geotag, nearby disease alerts)
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/ml/disease/potato/
    - assets/ml/disease/cotton/
    - assets/ml/disease/rice/
    - assets/ml/disease/wheat/
    - assets/ml/disease/staple_crops/
    - assets/ml/crop_recommendation/
    - assets/ml/price_forecast/
    - assets/knowledge_base/
