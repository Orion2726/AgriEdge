<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AgriEdge</title>
<style>
  :root { --green: #1e6b2a; --green-dk: #134a1c; --line: #c9d1cb; --bg: #eef1ef; --red: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
         font: 15px/1.5 "Noto Sans", "Segoe UI", Arial, Helvetica, sans-serif; color: #222; }
  form { background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--green); padding: 24px;
         width: min(340px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 12px; }
  label { font-weight: 600; }
  input { font: inherit; padding: 9px 10px; border: 1px solid #9aa59d; border-radius: 2px; }
  input:focus { outline: 2px solid #f0b400; }
  button { font: inherit; font-weight: 600; padding: 9px; background: var(--green); color: #fff; border: 1px solid var(--green-dk);
           border-radius: 2px; cursor: pointer; }
  button:hover { background: var(--green-dk); }
  .err { color: var(--red); font-size: 14px; min-height: 1.2em; margin: 0; }
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="off">
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" required autofocus>
  <button type="submit">Enter</button>
  <p class="err"><!--ERROR--></p>
</form>
</body>
</html>
